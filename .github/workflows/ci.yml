name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint + docstrings)
        run: |
          ruff check .

      - name: Tests with Pytest
        run: pytest

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install doc dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
          pip install -e ".[dev]"

      - name: Obtain coverage
        run: |
          pytest --cov=gatenet --cov-report=html:coverage/index.html

      - name: Build Docs
        run: mkdocs build --strict
