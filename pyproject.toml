[project]
name = "gatenet"
version = "0.21.0"
authors = [{ name = "MJ Anglin", email = "contact@mjanglin.com" }]
maintainers = [{ name = "MJ Anglin", email = "contact@mjanglin.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Networking",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
description = "Python-first networking observation toolkit with a thin CLI"
readme = { content-type = "text/markdown", file = "README.md" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["rich>=13.4.0"]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "mypy>=1.0.0",
  "ruff>=0.0.300",
  "pre-commit>=3.0.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.0.0",
  "mkdocstrings[python]>=0.25.0",
  "mkdocs-gen-files>=0.5.0",
  "mike>=2.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
gatenet = "gatenet.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.coverage.run]
omit = ["gatenet/cli/__main__.py"]

[tool.coverage.report]
omit = ["gatenet/cli/__main__.py"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--doctest-modules",
  "--strict-markers",
  "--cov=gatenet",
  "--cov-report=term-missing",
  "--cov-report=html:docs/coverage",
  "--cov-report=json",
]
testpaths = ["tests"]

[tool.ruff]
# Global Ruff settings can live here if needed
# (line-length, target-version, etc.)
exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "D", "B"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
